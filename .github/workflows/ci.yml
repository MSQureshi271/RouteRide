name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "11.5.1"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  # Turbo remote cache token (optional — set in repo secrets)
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ─── 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (TypeScript / JS)
        run: pnpm turbo lint

      - name: Lint (Python — ruff)
        working-directory: apps/matching
        run: |
          pip install ruff
          ruff check . --fix

  # ─── 2. Type-check ───────────────────────────────────────────────────────────
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (TypeScript)
        run: pnpm turbo typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Type-check (Python — mypy)
        working-directory: apps/matching
        run: |
          pip install mypy
          pip install -e ".[dev]"
          mypy app

  # ─── 3. Unit tests (Node packages) ───────────────────────────────────────────
  test-node:
    name: Unit tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm turbo test
        env:
          # Provide the minimal env that loadEnv() requires even for unit tests.
          NODE_ENV: test
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          JWT_ACCESS_TTL_SECONDS: "900"
          JWT_REFRESH_TTL_SECONDS: "2592000"
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          AWS_REGION: ap-south-1
          S3_DOCUMENTS_BUCKET: test-bucket
          MATCHING_SERVICE_URL: http://localhost:8000
          CORS_ALLOWED_ORIGINS: http://localhost:3001
          LAUNCH_CITY_NAME: Karachi
          LAUNCH_CITY_TIMEZONE: Asia/Karachi
          LAUNCH_CITY_BBOX_MIN_LAT: "24.7000"
          LAUNCH_CITY_BBOX_MAX_LAT: "25.1500"
          LAUNCH_CITY_BBOX_MIN_LON: "66.8500"
          LAUNCH_CITY_BBOX_MAX_LON: "67.3500"
          DEFAULT_CURRENCY: PKR
          STRIPE_ACCOUNT_COUNTRY: PK
          DRIVER_PRICE_MIN_CENTS: "500000"
          DRIVER_PRICE_MAX_CENTS: "3000000"
          REQUIRED_DRIVER_DOCUMENTS: cnic,license,vehicle_registration

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node
          path: "**/coverage/"
          retention-days: 7

  # ─── 4. Python unit tests + coverage ─────────────────────────────────────────
  test-python:
    name: Unit tests (Python / matching)
    runs-on: ubuntu-latest
    # Only run if matching-service files changed
    # (on push to main, always run; on PR, path-filtered below)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install matching-service dependencies
        working-directory: apps/matching
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        working-directory: apps/matching
        run: pytest

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: apps/matching/htmlcov/
          retention-days: 7

  # ─── 5. Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-node]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build

  # ─── 6. Dependency audit ─────────────────────────────────────────────────────
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (high severity and above)
        run: pnpm audit --audit-level=high --ignore GHSA-w3rx-r6r6-pgpr --ignore GHSA-5p2g-fcmc-qvqq

  # ─── 7. Integration tests (PostGIS + Redis) ───────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [build]
    # Path filter: only run if API or matching files changed
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: routeride_test
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_test_password_not_real' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d routeride_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prisma migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ci_user:${{ secrets.CI_DB_PASSWORD || 'ci_test_password_not_real' }}@localhost:5432/routeride_test

      - name: Run integration tests
        run: pnpm turbo test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci_user:${{ secrets.CI_DB_PASSWORD || 'ci_test_password_not_real' }}@localhost:5432/routeride_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          JWT_ACCESS_TTL_SECONDS: "900"
          JWT_REFRESH_TTL_SECONDS: "2592000"
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          AWS_REGION: ap-south-1
          S3_DOCUMENTS_BUCKET: test-bucket
          MATCHING_SERVICE_URL: http://localhost:8000
          CORS_ALLOWED_ORIGINS: http://localhost:3001
          LAUNCH_CITY_NAME: Karachi
          LAUNCH_CITY_TIMEZONE: Asia/Karachi
          LAUNCH_CITY_BBOX_MIN_LAT: "24.7000"
          LAUNCH_CITY_BBOX_MAX_LAT: "25.1500"
          LAUNCH_CITY_BBOX_MIN_LON: "66.8500"
          LAUNCH_CITY_BBOX_MAX_LON: "67.3500"
          DEFAULT_CURRENCY: PKR
          STRIPE_ACCOUNT_COUNTRY: PK
          DRIVER_PRICE_MIN_CENTS: "500000"
          DRIVER_PRICE_MAX_CENTS: "3000000"
          REQUIRED_DRIVER_DOCUMENTS: cnic,license,vehicle_registration
