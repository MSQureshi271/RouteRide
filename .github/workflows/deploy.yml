name: CD Pipeline

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ─── 1. Build and Push Container Images to ECR ─────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set output variables
        id: vars
        run: |
          echo "image_tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/routeride/api:sha-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/routeride/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Matching image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/matching/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/routeride/matching:sha-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/routeride/matching:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/routeride/admin:sha-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/routeride/admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 2. Deploy to Staging ──────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging (ECS)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_STAGING_DEPLOY_ROLE_ARN }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render API Task Definition
        id: task-def-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/staging-api-task-def.json
          container-name: api
          image: ${{ steps.login-ecr.outputs.registry }}/routeride/api:sha-${{ github.sha }}

      - name: Deploy API Service to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-api.outputs.task-definition }}
          service: routeride-staging-api
          cluster: routeride-staging-cluster
          wait-for-service-stability: true

  # ─── 3. Smoke Test Staging ─────────────────────────────────────────────────
  smoke-staging:
    name: Staging Smoke Verification
    needs: [deploy-staging]
    uses: ./.github/workflows/smoke.yml
    with:
      target_url: https://api-staging.routeride.com
      environment: staging

  # ─── 4. Gated Production Deployment ────────────────────────────────────────
  deploy-production:
    name: Deploy to Production (Gated)
    needs: [build-and-push, deploy-staging, smoke-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.routeride.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-south-1
          role-to-assume: ${{ secrets.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}

      - name: 1. Run Database Migrations (Pre-Deploy Phase)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Running database schema migrations against production..."
          pnpm install --frozen-lockfile
          pnpm --filter @routeride/api prisma:emit
          # Apply migration plan idempotently
          pnpm --filter @routeride/api prisma:migrate || exit 1
          echo "Database migrations applied successfully"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render Production API Task Definition
        id: prod-task-def-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/prod-api-task-def.json
          container-name: api
          image: ${{ steps.login-ecr.outputs.registry }}/routeride/api:sha-${{ github.sha }}

      - name: 2. Blue/Green ECS Deployment with 5-Minute Stability Gate
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.prod-task-def-api.outputs.task-definition }}
          service: routeride-prod-api
          cluster: routeride-prod-cluster
          wait-for-service-stability: true

  # ─── 5. Production Smoke Verification ──────────────────────────────────────
  smoke-production:
    name: Production Smoke Verification
    needs: [deploy-production]
    uses: ./.github/workflows/smoke.yml
    with:
      target_url: https://api.routeride.com
      environment: production
