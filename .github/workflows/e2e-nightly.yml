name: E2E Nightly Harness

on:
  schedule:
    # Run at 02:00 UTC every night
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  e2e-android:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Build Android App (Consumer)
        run: |
          pnpm --filter @routeride/mobile-consumer exec detox build --configuration android.emu.debug

      - name: Run Detox E2E (Consumer)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: pnpm --filter @routeride/mobile-consumer exec detox test --configuration android.emu.debug --headless

      - name: Upload Detox Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-android-artifacts
          path: apps/mobile-consumer/artifacts
