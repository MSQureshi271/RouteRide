---
# RouteRide — CI-Equivalent Integration Test Stack
# Uses ephemeral volumes — all data is discarded when containers stop.
# Usage: docker compose -f docker-compose.test.yml up -d
# Tear down: docker compose -f docker-compose.test.yml down -v

services:
  # ─── PostgreSQL 16 + PostGIS 3.4 (ephemeral) ───────────────────────────────
  postgres_test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: routeride_test
      POSTGRES_USER: routeride_test
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral — no volume mount
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeride_test -d routeride_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Redis 7 (ephemeral) ────────────────────────────────────────────────────
  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  # ─── LocalStack (S3, ephemeral) ─────────────────────────────────────────────
  localstack_test:
    image: localstack/localstack:3
    ports:
      - "4567:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

# No named volumes — ephemeral by design
