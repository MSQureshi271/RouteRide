packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@firebase/util"
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "@sentry/node-cpu-profiler"
  - "@swc/core"
  - bcrypt
  - esbuild
  - msgpackr-extract
  - prisma
  - protobufjs
  - sharp
  - workerd

allowBuilds:
  "@firebase/util": true
  "@nestjs/core": true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/node-cpu-profiler": true
  "@swc/core": true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  postcss: "^8.5.26"
  tar: "^7.5.22"
  sharp: "^0.35.4"
  "@xmldom/xmldom": "^0.8.15"
