packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  "@nestjs/core": true
  "@swc/core": true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  protobufjs: set this to true or false
  "@sentry/node-cpu-profiler": set this to true or false
  msgpackr-extract: set this to true or false
  workerd: set this to true or false

overrides:
  postcss: "^8.5.26"
  tar: "^7.5.22"
  sharp: "^0.35.4"
  "@xmldom/xmldom": "^0.8.15"
